name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-ext: tar.gz
          - os: windows-latest
            rid: win-x64
            artifact-ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish Spectre.UI/Spectre.UI.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf spectre-${{ matrix.rid }}.tar.gz -C out/${{ matrix.rid }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath spectre-${{ matrix.rid }}.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectre-${{ matrix.rid }}
          path: spectre-${{ matrix.rid }}.${{ matrix.artifact-ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
